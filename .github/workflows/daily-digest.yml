name: Daily Digital Competition Digest

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC. GitHub Actions cron is always UTC.
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python digest.py
